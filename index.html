<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Landmark Viewer</title>
  <!-- v9: Sketchfab embed. Real community-uploaded models replace the
       procedural geometry in v1-v8. Search calls /api/search (server-side
       Sketchfab proxy), result loads in a Sketchfab embed iframe. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%8F%9B%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0b0c10;
      --surface: #12131a;
      --surface2: #1a1b25;
      --surface3: #1e1f2a;
      --accent: #5b8cff;
      --accent2: #8fb4ff;
      --text: #e8eaf0;
      --muted: #7a7d92;
      --border: #252733;
      --footer-bg: #0d0e14;
      --green: #4ade80;
    }
    html, body {
      width: 100%; height: 100%; background: var(--bg);
      color: var(--text); overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #app { display: flex; flex-direction: column; height: 100vh; }

    /* ── Header ── */
    #header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      height: 48px;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
      gap: 12px;
    }
    #header h1 {
      font-size: 15px; font-weight: 600; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    #header h1 span { color: var(--accent); }
    #dl-btn {
      background: var(--surface2); color: var(--accent2);
      border: 1px solid var(--border);
      border-radius: 5px; padding: 5px 12px; font-size: 12px;
      font-weight: 500; cursor: pointer; white-space: nowrap;
      text-decoration: none; display: none;
    }
    #dl-btn:hover { border-color: var(--accent); }

    /* ── Search bar ── */
    #search-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      flex-shrink: 0;
      position: relative;
    }
    #search-wrap { position: relative; max-width: 560px; margin: 0 auto; }
    #search-input {
      width: 100%; background: var(--surface2); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 9px 42px 9px 14px; font-size: 16px;
      outline: none; transition: border-color 0.15s;
    }
    #search-input:focus { border-color: var(--accent); }
    #search-input::placeholder { color: var(--muted); }
    #search-icon {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      color: var(--muted); font-size: 16px; pointer-events: none;
    }
    #search-icon.spinning {
      width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid var(--border); border-top-color: var(--accent);
      animation: spin 0.7s linear infinite; font-size: 0;
      right: 13px; top: 50%; transform: translateY(-50%);
    }
    @keyframes spin { to { transform: translateY(-50%) rotate(360deg); } }

    /* ── Dropdown suggestions ── */
    #suggestions {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; z-index: 100; overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      display: none;
    }
    .sug-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }
    .sug-item:last-child { border-bottom: none; }
    .sug-item:hover, .sug-item.active { background: var(--surface3); }
    .sug-thumb {
      width: 44px; height: 33px; border-radius: 4px;
      object-fit: cover; background: var(--surface3); flex-shrink: 0;
    }
    .sug-thumb-ph {
      width: 44px; height: 33px; border-radius: 4px;
      background: var(--surface3); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .sug-meta { min-width: 0; flex: 1; }
    .sug-name {
      font-size: 13px; font-weight: 500; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .sug-sub {
      font-size: 11px; color: var(--muted); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; margin-top: 2px;
    }
    .sug-dl {
      font-size: 10px; padding: 2px 6px; border-radius: 3px;
      background: rgba(74, 222, 128, 0.15); color: var(--green);
      border: 1px solid rgba(74, 222, 128, 0.3); flex-shrink: 0;
    }
    .sug-empty {
      padding: 14px 16px; color: var(--muted); font-size: 13px;
      text-align: center;
    }

    /* ── Viewer area ── */
    #viewer-area {
      flex: 1; position: relative; overflow: hidden;
      background: var(--bg);
    }
    #placeholder {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px; padding: 24px; text-align: center;
    }
    .ph-icon { font-size: 48px; }
    #placeholder p { font-size: 15px; color: var(--muted); }
    #placeholder .ph-sub {
      font-size: 12px; color: var(--muted); opacity: 0.65;
      max-width: 380px; line-height: 1.5;
    }
    #viewer-frame {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      border: none; display: none;
    }
    #viewer-loading {
      position: absolute; inset: 0;
      display: none; align-items: center; justify-content: center;
      background: var(--bg);
      flex-direction: column; gap: 16px;
    }
    .load-spinner {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid var(--border); border-top-color: var(--accent);
      animation: spin2 0.8s linear infinite;
    }
    @keyframes spin2 { to { transform: rotate(360deg); } }
    #viewer-loading p { font-size: 13px; color: var(--muted); }

    /* ── Model info bar ── */
    #model-info {
      background: var(--surface); border-top: 1px solid var(--border);
      padding: 7px 16px;
      display: none; flex-wrap: wrap; align-items: center;
      gap: 6px 14px; flex-shrink: 0;
    }
    #model-name { font-size: 13px; font-weight: 600; }
    .info-chip {
      font-size: 11px; color: var(--muted); display: flex;
      align-items: center; gap: 4px;
    }
    .info-chip span { color: var(--text); }
    .license-badge {
      font-size: 10px; padding: 2px 6px; border-radius: 3px;
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--muted);
    }

    /* ── Footer ── */
    footer {
      background: var(--footer-bg); border-top: 1px solid var(--border);
      padding: 7px 16px; font-size: 11px; color: var(--muted);
      text-align: center; flex-shrink: 0;
    }

    @media (max-width: 480px) {
      #header h1 { font-size: 14px; }
      #search-input { font-size: 16px; }
    }
  </style>
</head>
<body>
<div id="app">
  <div id="header">
    <h1>🏛️ <span>3D</span> Landmark Viewer</h1>
    <a id="dl-btn" target="_blank" rel="noopener noreferrer">View &amp; download ↗</a>
  </div>

  <div id="search-bar">
    <div id="search-wrap">
      <input
        id="search-input"
        type="text"
        placeholder="Search a landmark — try &#x27;Eiffel Tower&#x27; or &#x27;Colosseum&#x27;"
        autocomplete="off"
        spellcheck="false"
      >
      <span id="search-icon">🔍</span>
      <div id="suggestions" role="listbox" aria-label="Search results"></div>
    </div>
  </div>

  <div id="viewer-area">
    <div id="placeholder">
      <div class="ph-icon">🏛️</div>
      <p>Search for a famous landmark above to load its 3D model</p>
      <p class="ph-sub">
        Models sourced from Sketchfab's public library — real community-uploaded
        3D geometry, not procedural shapes.
      </p>
    </div>
    <div id="viewer-loading">
      <div class="load-spinner"></div>
      <p>Loading 3D model…</p>
    </div>
    <iframe
      id="viewer-frame"
      title="3D Landmark Viewer"
      allow="autoplay; fullscreen; xr-spatial-tracking"
      allowfullscreen
      mozallowfullscreen="true"
      webkitallowfullscreen="true"
    ></iframe>
  </div>

  <div id="model-info">
    <span id="model-name"></span>
    <span class="info-chip">by <span id="model-author"></span></span>
    <span id="model-license" class="license-badge"></span>
    <span class="info-chip" id="model-faces-wrap">
      <span id="model-faces"></span> faces
    </span>
    <span class="info-chip" style="margin-left:auto; font-size:10px; opacity:0.5">
      via Sketchfab
    </span>
  </div>

  <footer>Built by Fleet · Alpha access</footer>
</div>

<script>
(function () {
  'use strict';

  const searchInput  = document.getElementById('search-input');
  const searchIcon   = document.getElementById('search-icon');
  const suggestions  = document.getElementById('suggestions');
  const placeholder  = document.getElementById('placeholder');
  const viewerLoading = document.getElementById('viewer-loading');
  const viewerFrame  = document.getElementById('viewer-frame');
  const modelInfo    = document.getElementById('model-info');
  const modelName    = document.getElementById('model-name');
  const modelAuthor  = document.getElementById('model-author');
  const modelLicense = document.getElementById('model-license');
  const modelFaces   = document.getElementById('model-faces');
  const modelFacesWrap = document.getElementById('model-faces-wrap');
  const dlBtn        = document.getElementById('dl-btn');

  let results        = [];
  let activeIdx      = -1;
  let debounceTimer  = null;
  let currentUid     = null;

  // ── Search ──────────────────────────────────────────────────────────────

  function setSpinning(on) {
    searchIcon.className = on ? 'spinning' : '';
    if (!on) searchIcon.textContent = '🔍';
  }

  async function doSearch(q) {
    if (!q.trim()) { hideSuggestions(); return; }
    setSpinning(true);
    try {
      const res = await fetch(`/api/search?q=${encodeURIComponent(q)}&count=8`);
      const data = await res.json();
      results = data.results || [];
      renderSuggestions(results);
    } catch (_) {
      results = [];
      renderSuggestions([]);
    } finally {
      setSpinning(false);
    }
  }

  searchInput.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    const q = searchInput.value.trim();
    if (!q) { hideSuggestions(); return; }
    debounceTimer = setTimeout(() => doSearch(q), 280);
  });

  searchInput.addEventListener('focus', () => {
    if (results.length) showSuggestions();
  });

  document.addEventListener('click', e => {
    if (!e.target.closest('#search-wrap')) hideSuggestions();
  });

  searchInput.addEventListener('keydown', e => {
    if (!suggestions.style.display || suggestions.style.display === 'none') return;
    const items = suggestions.querySelectorAll('.sug-item');
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      activeIdx = Math.min(activeIdx + 1, items.length - 1);
      updateActive(items);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      activeIdx = Math.max(activeIdx - 1, 0);
      updateActive(items);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (activeIdx >= 0 && activeIdx < results.length) loadModel(results[activeIdx]);
    } else if (e.key === 'Escape') {
      hideSuggestions();
    }
  });

  function updateActive(items) {
    items.forEach((el, i) => el.classList.toggle('active', i === activeIdx));
    if (activeIdx >= 0) items[activeIdx]?.scrollIntoView({ block: 'nearest' });
  }

  // ── Suggestions rendering ────────────────────────────────────────────────

  function renderSuggestions(items) {
    activeIdx = -1;
    if (!items.length) {
      suggestions.innerHTML = '<div class="sug-empty">No models found — try a different name</div>';
      showSuggestions();
      return;
    }
    suggestions.innerHTML = items.map((m, i) => {
      const thumb = m.thumbnail
        ? `<img class="sug-thumb" src="${esc(m.thumbnail)}" alt="" loading="lazy">`
        : `<div class="sug-thumb-ph">🏛️</div>`;
      const dlTag = m.isDownloadable ? '<span class="sug-dl">↓ downloadable</span>' : '';
      const faces = m.faceCount ? `${fmtFaces(m.faceCount)} faces` : '';
      const sub = [m.author, faces].filter(Boolean).join(' · ');
      return `<div class="sug-item" data-idx="${i}" role="option" tabindex="-1">
        ${thumb}
        <div class="sug-meta">
          <div class="sug-name">${esc(m.name)}</div>
          ${sub ? `<div class="sug-sub">${esc(sub)}</div>` : ''}
        </div>
        ${dlTag}
      </div>`;
    }).join('');

    suggestions.querySelectorAll('.sug-item').forEach(el => {
      el.addEventListener('mousedown', e => {
        e.preventDefault(); // keep focus on input
        const idx = parseInt(el.dataset.idx, 10);
        if (!isNaN(idx)) loadModel(items[idx]);
      });
    });

    showSuggestions();
  }

  function showSuggestions() {
    suggestions.style.display = 'block';
  }

  function hideSuggestions() {
    suggestions.style.display = 'none';
  }

  // ── Load model ───────────────────────────────────────────────────────────

  function loadModel(model) {
    hideSuggestions();
    searchInput.value = model.name;
    currentUid = model.uid;

    // Show loading state
    placeholder.style.display = 'none';
    viewerFrame.style.display = 'none';
    viewerLoading.style.display = 'flex';

    // Build embed URL
    const embedSrc = `${model.embedUrl}?autostart=1&ui_theme=dark&autospin=0.4&camera=0&preload=1`;
    viewerFrame.src = embedSrc;

    viewerFrame.onload = () => {
      viewerLoading.style.display = 'none';
      viewerFrame.style.display = 'block';
    };

    // Fallback: show viewer after 4s if onload doesn't fire (cross-origin iframes
    // sometimes suppress the load event)
    setTimeout(() => {
      if (viewerFrame.style.display !== 'block') {
        viewerLoading.style.display = 'none';
        viewerFrame.style.display = 'block';
      }
    }, 4000);

    // Update info bar
    modelName.textContent = model.name;
    modelAuthor.textContent = model.author || 'unknown';
    modelLicense.textContent = model.license || '';
    modelLicense.style.display = model.license ? 'inline' : 'none';
    if (model.faceCount) {
      modelFaces.textContent = fmtFaces(model.faceCount);
      modelFacesWrap.style.display = 'inline-flex';
    } else {
      modelFacesWrap.style.display = 'none';
    }
    modelInfo.style.display = 'flex';

    // Download button
    if (model.isDownloadable && model.viewerUrl) {
      dlBtn.href = model.viewerUrl;
      dlBtn.style.display = 'inline-block';
    } else if (model.viewerUrl) {
      dlBtn.href = model.viewerUrl;
      dlBtn.style.display = 'inline-block';
    } else {
      dlBtn.style.display = 'none';
    }
  }

  // ── Utils ────────────────────────────────────────────────────────────────

  function esc(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function fmtFaces(n) {
    if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
    if (n >= 1000) return (n / 1000).toFixed(0) + 'k';
    return String(n);
  }
})();
</script>
</body>
</html>
