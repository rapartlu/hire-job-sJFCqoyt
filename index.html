<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Landmark Viewer</title>
  <!-- v7: no importmap — UMD build loaded via script tags with jsDelivr to unpkg fallback.
       Importmap + ES module approach was failing for some networks/proxies/content-blockers. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%8F%9B%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0b0c10;
      --surface: #12131a;
      --surface2: #1a1b25;
      --accent: #5b8cff;
      --accent2: #8fb4ff;
      --text: #e8eaf0;
      --muted: #7a7d92;
      --border: #252733;
      --footer-bg: #0d0e14;
    }
    html, body {
      width: 100%; height: 100%; background: var(--bg);
      color: var(--text); overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #app { display: flex; flex-direction: column; height: 100vh; }

    #header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      height: 48px;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    #header h1 { font-size: 15px; font-weight: 600; }
    #header h1 span { color: var(--accent); }
    #dl-btn {
      background: var(--accent); color: #fff; border: none;
      border-radius: 5px; padding: 6px 14px; font-size: 13px;
      font-weight: 500; cursor: pointer; opacity: 1;
      transition: opacity 0.15s;
    }
    #dl-btn:hover { opacity: 0.85; }
    #dl-btn:disabled { opacity: 0.35; cursor: default; }

    #search-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      flex-shrink: 0;
      position: relative;
    }
    #search-wrap { position: relative; max-width: 480px; margin: 0 auto; }
    #search-input {
      width: 100%; background: var(--surface2); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 9px 42px 9px 14px; font-size: 14px;
      outline: none; transition: border-color 0.15s;
    }
    #search-input:focus { border-color: var(--accent); }
    #search-input::placeholder { color: var(--muted); }
    #search-input:disabled { opacity: 0.7; cursor: wait; }
    #search-bar.loading #search-icon {
      width: 15px; height: 15px; border-radius: 50%;
      border: 2px solid var(--border); border-top-color: var(--accent);
      animation: spin-centered 0.8s linear infinite; font-size: 0;
    }
    @keyframes spin-centered { to { transform: translateY(-50%) rotate(360deg); } }
    #search-icon {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      color: var(--muted); font-size: 16px; pointer-events: none;
    }
    #suggestions {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; z-index: 100; overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      display: none;
    }
    #suggestions.open { display: block; }
    .suggestion {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 14px; cursor: pointer;
      transition: background 0.1s;
    }
    .suggestion:hover, .suggestion.selected { background: rgba(91,140,255,0.12); }
    .sug-icon { font-size: 20px; min-width: 24px; text-align: center; }
    .sug-name { font-size: 13px; font-weight: 500; }
    .sug-city { font-size: 11px; color: var(--muted); }
    #no-results {
      padding: 14px; text-align: center;
      font-size: 13px; color: var(--muted);
      display: none;
    }

    #canvas-wrap {
      flex: 1; position: relative; overflow: hidden; min-height: 0;
      touch-action: none;
    }
    #canvas-wrap canvas { display: block; width: 100% !important; height: 100% !important; touch-action: none; }

    #loader {
      position: absolute; inset: 0; z-index: 50;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; background: var(--bg); padding: 24px; text-align: center;
    }
    #loader .spinner {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid var(--border); border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loader-text { font-size: 13px; color: var(--muted); max-width: 320px; line-height: 1.5; }
    #loader.error .spinner { display: none; }
    #loader.error #loader-text { color: var(--accent2); }

    #empty-state {
      position: absolute; inset: 0; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; pointer-events: none;
    }
    #empty-state .icon { font-size: 52px; opacity: 0.25; }
    #empty-state p { font-size: 14px; color: var(--muted); }

    #info-overlay {
      position: absolute; bottom: 14px; left: 14px;
      background: rgba(10,11,18,0.82); backdrop-filter: blur(6px);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 9px 14px; pointer-events: none;
      display: none;
    }
    #info-overlay.visible { display: block; }
    #info-name { font-size: 15px; font-weight: 600; }
    #info-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
    #hint {
      position: absolute; top: 10px; right: 12px;
      font-size: 11px; color: rgba(255,255,255,0.3);
      pointer-events: none; text-align: right; line-height: 1.6;
      display: none;
    }
    #hint.visible { display: block; }

    #footer {
      height: 34px; background: var(--footer-bg);
      border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      gap: 10px; font-size: 11px; color: var(--muted); flex-shrink: 0;
    }
    #footer a { color: var(--accent); text-decoration: none; }
    #footer a:hover { text-decoration: underline; }

    @media (max-width: 500px) {
      #search-input { font-size: 16px; }
    }
  </style>
</head>
<body>
<div id="app">
  <header id="header">
    <h1>3D <span>Landmark</span> Viewer</h1>
    <button id="dl-btn" disabled>&#8595; Download .glb</button>
  </header>

  <div id="search-bar" class="loading">
    <div id="search-wrap">
      <input id="search-input" type="text" placeholder="Starting 3D engine&hellip;" autocomplete="off" spellcheck="false" disabled>
      <span id="search-icon">&#x1F50D;</span>
      <div id="suggestions">
        <div id="no-results">No landmarks found. More coming soon.</div>
      </div>
    </div>
  </div>

  <main id="canvas-wrap">
    <div id="loader"><div class="spinner"></div><p id="loader-text">Loading 3D engine&hellip;</p></div>
    <div id="empty-state">
      <div class="icon">&#x1F3DB;&#xFE0F;</div>
      <p>Search for a landmark above to load its 3D model.</p>
    </div>
    <div id="info-overlay">
      <div id="info-name"></div>
      <div id="info-meta"></div>
    </div>
    <div id="hint">Drag to rotate &nbsp;&#183;&nbsp; Scroll to zoom</div>
  </main>

  <footer id="footer">
    <span>Built by Fleet &middot; Alpha access</span>
    <span>&middot;</span>
    <a href="https://hire.autonomous-fleet.workers.dev" target="_blank" rel="noopener">hire.autonomous-fleet.workers.dev</a>
  </footer>
</div>

<script>
// Watchdog: fires after 25 seconds if the viewer never boots.
// 25s gives the fallback chain (jsDelivr to unpkg) time to complete on slow networks.
window.__viewerReady = false;

function __showFatal(msg) {
  var loader = document.getElementById('loader');
  var text = document.getElementById('loader-text');
  if (loader) loader.classList.add('error');
  if (text) text.innerHTML = (msg || 'The 3D engine did not load. Check your connection or any content blocker, then reload.') +
    '<br><br><a href="" onclick="location.reload();return false;" style="color:var(--accent2)">Reload</a>';
  var bar = document.getElementById('search-bar');
  if (bar) bar.classList.remove('loading');
  var si = document.getElementById('search-input');
  if (si) si.placeholder = '3D engine failed — reload the page';
}

setTimeout(function() {
  if (window.__viewerReady) return;
  __showFatal('The 3D engine took too long to load. Check your connection or any content blocker, then reload.');
}, 25000);

// Library loader: Three.js r147 UMD build with jsDelivr to unpkg fallback.
// r147 is the last Three.js release that ships examples/js/ (UMD addons).
// UMD builds set window.THREE, THREE.OrbitControls, THREE.GLTFExporter — no importmap needed.
(function() {
  var CDN = {
    three: [
      'https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js',
      'https://unpkg.com/three@0.147.0/build/three.min.js'
    ],
    orbitControls: [
      'https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js',
      'https://unpkg.com/three@0.147.0/examples/js/controls/OrbitControls.js'
    ],
    gltfExporter: [
      'https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/exporters/GLTFExporter.js',
      'https://unpkg.com/three@0.147.0/examples/js/exporters/GLTFExporter.js'
    ]
  };

  function loadScript(srcs, idx, onOk, onFail) {
    if (idx >= srcs.length) { onFail(); return; }
    var s = document.createElement('script');
    s.src = srcs[idx];
    s.onload = onOk;
    s.onerror = function() { loadScript(srcs, idx + 1, onOk, onFail); };
    document.head.appendChild(s);
  }

  loadScript(CDN.three, 0,
    function() {
      loadScript(CDN.orbitControls, 0,
        function() {
          loadScript(CDN.gltfExporter, 0,
            function() { initViewer(); },
            function() { __showFatal('Could not load the GLTFExporter module. Try disabling any content blockers.'); }
          );
        },
        function() { __showFatal('Could not load OrbitControls. Try disabling any content blockers.'); }
      );
    },
    function() { __showFatal('Could not load Three.js from any CDN. Check your internet connection or content blockers.'); }
  );
})();

// Viewer: called once THREE, OrbitControls, and GLTFExporter are all loaded.
// Uses window.THREE global (UMD build) — no ES module imports required.
function initViewer() {

function mat(color, roughness, metalness) {
  if (roughness === undefined) roughness = 0.8;
  if (metalness === undefined) metalness = 0.05;
  return new THREE.MeshStandardMaterial({ color: color, roughness: roughness, metalness: metalness });
}

function buildEiffelTower() {
  var g = new THREE.Group();
  var ironDark = mat(0x3b2f1e, 0.75, 0.35);
  var ironMid  = mat(0x5c4a35, 0.70, 0.30);
  var legData  = [{dx:1.6,dz:1.6},{dx:-1.6,dz:1.6},{dx:1.6,dz:-1.6},{dx:-1.6,dz:-1.6}];
  legData.forEach(function(ld) {
    var pts = [new THREE.Vector3(ld.dx,0,ld.dz), new THREE.Vector3(ld.dx*0.35,4.5,ld.dz*0.35)];
    var curve = new THREE.CatmullRomCurve3(pts);
    g.add(new THREE.Mesh(new THREE.TubeGeometry(curve,6,0.14,6,false), ironDark));
    for (var j=0;j<3;j++){
      var b = new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.6,4), ironMid);
      var p0=curve.getPoint(j/3), p1=curve.getPoint(j/3+0.15);
      b.position.lerpVectors(p0,p1,0.5); b.lookAt(p1); b.rotateX(Math.PI/2);
      g.add(b);
    }
  });
  var plat1 = new THREE.Mesh(new THREE.BoxGeometry(3.0,0.28,3.0), ironDark); plat1.position.y=4.5; g.add(plat1);
  for(var i=0;i<16;i++){var a=(i/16)*Math.PI*2;var p=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.35,0.06),ironMid);p.position.set(Math.cos(a)*1.4,4.8,Math.sin(a)*1.4);g.add(p);}
  legData.forEach(function(ld){
    var pts=[new THREE.Vector3(ld.dx*0.22,4.5,ld.dz*0.22),new THREE.Vector3(ld.dx*0.06,8.0,ld.dz*0.06)];
    var curve=new THREE.CatmullRomCurve3(pts);
    g.add(new THREE.Mesh(new THREE.TubeGeometry(curve,4,0.09,5,false),ironDark));
  });
  var plat2=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.22,1.5),ironDark); plat2.position.y=8; g.add(plat2);
  var upper=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.65,4,10),ironDark); upper.position.y=10; g.add(upper);
  var plat3=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,0.2,12),ironMid); plat3.position.y=12; g.add(plat3);
  var spire=new THREE.Mesh(new THREE.ConeGeometry(0.22,3.5,8),ironDark); spire.position.y=13.75; g.add(spire);
  var tip=new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,1.2,5),ironMid); tip.position.y=15.6; g.add(tip);
  return g;
}

function buildColosseum() {
  var g = new THREE.Group();
  var stone=mat(0xc8a76a,0.92), dark=mat(0x9e8350,0.95), arch=mat(0x4a3d28,0.98);
  var a=6.5, b=5.2, FLOORS=3, FH=1.6, BAYS=32;
  function ep(ang){return new THREE.Vector2(Math.cos(ang)*a,Math.sin(ang)*b);}
  for(var floor=0;floor<FLOORS;floor++){
    var fy=floor*FH; var s=1-floor*0.02;
    var ws=new THREE.Shape();
    for(var i=0;i<=BAYS;i++){var ang=(i/BAYS)*Math.PI*2;var p=ep(ang);if(i===0)ws.moveTo(p.x*s,p.y*s);else ws.lineTo(p.x*s,p.y*s);}
    var hole=new THREE.Path();
    for(var i2=0;i2<=BAYS;i2++){var ang2=(i2/BAYS)*Math.PI*2;if(i2===0)hole.moveTo(Math.cos(ang2)*(a-1)*s,Math.sin(ang2)*(b-0.8)*s);else hole.lineTo(Math.cos(ang2)*(a-1)*s,Math.sin(ang2)*(b-0.8)*s);}
    ws.holes.push(hole);
    var wg=new THREE.ExtrudeGeometry(ws,{depth:FH*0.55,bevelEnabled:false}); wg.rotateX(Math.PI/2);
    var wm=new THREE.Mesh(wg,stone); wm.position.y=fy; g.add(wm);
    for(var i3=0;i3<BAYS;i3++){
      var ang3=(i3/BAYS)*Math.PI*2; var pp=ep(ang3);
      var pillar=new THREE.Mesh(new THREE.BoxGeometry(0.22,FH,0.22),dark);
      pillar.position.set(pp.x*s*0.975,fy+FH/2,pp.y*s*0.975); g.add(pillar);
      if(floor<FLOORS-1){var ma=(i3+0.5)/BAYS*Math.PI*2;var mx=Math.cos(ma)*a*s;var mz=Math.sin(ma)*b*s;var av=new THREE.Mesh(new THREE.BoxGeometry(0.18,FH*0.58,0.12),arch);av.position.set(mx*0.965,fy+FH*0.34,mz*0.965);av.lookAt(av.position.x*2,av.position.y,av.position.z*2);g.add(av);}
    }
  }
  var as2=new THREE.Shape();
  for(var i4=0;i4<=BAYS;i4++){var ang4=(i4/BAYS)*Math.PI*2;if(i4===0)as2.moveTo(Math.cos(ang4)*a*0.96,Math.sin(ang4)*b*0.96);else as2.lineTo(Math.cos(ang4)*a*0.96,Math.sin(ang4)*b*0.96);}
  var ah=new THREE.Path();
  for(var i5=0;i5<=BAYS;i5++){var ang5=(i5/BAYS)*Math.PI*2;if(i5===0)ah.moveTo(Math.cos(ang5)*(a-1)*0.96,Math.sin(ang5)*(b-0.8)*0.96);else ah.lineTo(Math.cos(ang5)*(a-1)*0.96,Math.sin(ang5)*(b-0.8)*0.96);}
  as2.holes.push(ah);
  var ag=new THREE.ExtrudeGeometry(as2,{depth:0.9,bevelEnabled:false}); ag.rotateX(Math.PI/2);
  g.add(new THREE.Mesh(ag,dark));
  return g;
}

function buildBigBen() {
  var g = new THREE.Group();
  var lime=mat(0xc8c0a0,0.9), roof=mat(0x4a6040,0.8), clock=mat(0xf0edd8,0.6), gold=mat(0xb8922a,0.4,0.6), dk=mat(0x3a3530,0.95);
  var base=new THREE.Mesh(new THREE.BoxGeometry(3.2,0.6,3.2),lime); base.position.set(0,0.3,0); g.add(base);
  var tower=new THREE.Mesh(new THREE.BoxGeometry(2.6,9,2.6),lime); tower.position.y=5.1; g.add(tower);
  var belfry=new THREE.Mesh(new THREE.BoxGeometry(2.8,1.2,2.8),lime); belfry.position.y=10.2; g.add(belfry);
  var cs=new THREE.Mesh(new THREE.BoxGeometry(2.8,1.8,2.8),clock); cs.position.y=11.7; g.add(cs);
  [{pos:[0,11.7,1.42],ry:0},{pos:[0,11.7,-1.42],ry:Math.PI},{pos:[1.42,11.7,0],ry:Math.PI/2},{pos:[-1.42,11.7,0],ry:-Math.PI/2}].forEach(function(face){
    var ring=new THREE.Mesh(new THREE.RingGeometry(0.55,0.65,32),gold); ring.position.set(face.pos[0],face.pos[1],face.pos[2]); ring.rotation.y=face.ry; ring.rotation.x=Math.PI/2; g.add(ring);
    var fm=new THREE.Mesh(new THREE.CircleGeometry(0.55,32),clock); fm.position.set(face.pos[0],face.pos[1],face.pos[2]); fm.rotation.y=face.ry; fm.rotation.x=Math.PI/2; g.add(fm);
  });
  var corb=new THREE.Mesh(new THREE.BoxGeometry(3,0.3,3),gold); corb.position.y=12.75; g.add(corb);
  var sb=new THREE.Mesh(new THREE.CylinderGeometry(1.6,1.4,0.8,8),roof); sb.position.y=13.3; g.add(sb);
  var sp=new THREE.Mesh(new THREE.CylinderGeometry(0.05,1,5.5,8),roof); sp.position.y=16.45; g.add(sp);
  return g;
}

function buildTajMahal() {
  var g = new THREE.Group();
  var mb=mat(0xf5f0e8,0.3,0.05), ms=mat(0xddd5c0,0.4,0.05), inl=mat(0xb8d4c8,0.5,0.1), ar=mat(0x1a1814,0.95);
  var plat=new THREE.Mesh(new THREE.BoxGeometry(11,0.7,11),ms); plat.position.set(0,0.35,0); g.add(plat);
  var pplat=new THREE.Mesh(new THREE.BoxGeometry(10,0.5,10),mb); pplat.position.set(0,0.95,0); g.add(pplat);
  [[-4.2,0,-4.2],[4.2,0,-4.2],[-4.2,0,4.2],[4.2,0,4.2]].forEach(function(mn){
    var mx=mn[0],mz=mn[2];
    var r1=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.45,0.4,12),ms); r1.position.set(mx,1.4,mz); g.add(r1);
    var msh=new THREE.Mesh(new THREE.CylinderGeometry(0.30,0.38,5.5,12),mb); msh.position.set(mx,4.45,mz); g.add(msh);
    [2.5,4,5.5].forEach(function(bh){var band=new THREE.Mesh(new THREE.CylinderGeometry(0.45,0.45,0.18,12),ms);band.position.set(mx,1.6+bh,mz);g.add(band);});
    var mdom=new THREE.Mesh(new THREE.SphereGeometry(0.35,10,7,0,Math.PI*2,0,Math.PI/2),mb); mdom.position.set(mx,7.5,mz); g.add(mdom);
    var mpin=new THREE.Mesh(new THREE.ConeGeometry(0.08,1,6),ms); mpin.position.set(mx,8.3,mz); g.add(mpin);
  });
  var cbody=new THREE.Mesh(new THREE.BoxGeometry(5.5,3.5,5.5),mb); cbody.position.set(0,2.95,0); g.add(cbody);
  [[0,2.8,2.76,0],[0,2.8,-2.76,Math.PI],[2.76,2.8,0,Math.PI/2],[-2.76,2.8,0,-Math.PI/2]].forEach(function(af){
    var am=new THREE.Mesh(new THREE.BoxGeometry(1.6,2.5,0.1),ar); am.position.set(af[0],af[1],af[2]); am.rotation.y=af[3]; g.add(am);
  });
  [[-2,4.7,-2],[2,4.7,-2],[-2,4.7,2],[2,4.7,2]].forEach(function(td){
    var tx=td[0],ty=td[1],tz=td[2];
    var tb=new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.6,1,8),mb); tb.position.set(tx,ty,tz); g.add(tb);
    var tdom=new THREE.Mesh(new THREE.SphereGeometry(0.55,8,6,0,Math.PI*2,0,Math.PI/2),mb); tdom.position.set(tx,ty+0.55,tz); g.add(tdom);
    var tpin=new THREE.Mesh(new THREE.ConeGeometry(0.1,0.8,6),ms); tpin.position.set(tx,ty+1.1,tz); g.add(tpin);
  });
  var drum=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.6,0.9,8),mb); drum.position.y=5.15; g.add(drum);
  var dpts=[]; for(var di=0;di<=20;di++){var dt=di/20;var dr=(1-dt)*2.2;var dh=Math.sin(dt*Math.PI)*3.5*(1-dt*0.3);dpts.push(new THREE.Vector2(dr*(1+dt*0.35),dh));}
  var dome=new THREE.Mesh(new THREE.LatheGeometry(dpts,24),mb); dome.position.y=5.6; g.add(dome);
  var dpin=new THREE.Mesh(new THREE.ConeGeometry(0.1,1.2,6),ms); dpin.position.set(0,9.5,0); g.add(dpin);
  var dball=new THREE.Mesh(new THREE.SphereGeometry(0.12,8,6),ms); dball.position.set(0,10.1,0); g.add(dball);
  var inlay=new THREE.Mesh(new THREE.BoxGeometry(5.52,0.12,5.52),inl); inlay.position.set(0,4.7,0); g.add(inlay);
  return g;
}

function buildStatueOfLiberty() {
  var g = new THREE.Group();

function searchLandmarks(query) {
  var q = query.toLowerCase().trim();
  if (!q) return LANDMARKS.slice(0, 6);
  return LANDMARKS.filter(function(lm) {
    return lm.aliases.some(function(a){return a.includes(q);}) || lm.name.toLowerCase().includes(q) || lm.city.toLowerCase().includes(q);
  });
}

  sugBox.querySelectorAll('.suggestion').forEach(function(el){el.remove();});
  selIdx = -1;
  if (results.length === 0) { noResults.style.display='block'; sugBox.classList.add('open'); return; }
  noResults.style.display = 'none';
  results.forEach(function(lm) {
    var div = document.createElement('div');
    div.className = 'suggestion';
    div.innerHTML = '<span class="sug-icon">'+lm.icon+'</span><div><div class="sug-name">'+lm.name+'</div><div class="sug-city">'+lm.city+'</div></div>';
    div.addEventListener('pointerdown', function(e){e.preventDefault();searchInput.value=lm.name;sugBox.classList.remove('open');selectLandmark(lm);});
    sugBox.appendChild(div);
  });
  sugBox.classList.add('open');
}

searchInput.addEventListener('input', function(){var q=searchInput.value.trim();if(!q){sugBox.classList.remove('open');return;}renderSuggestions(searchLandmarks(q));});
searchInput.addEventListener('focus', function(){var q=searchInput.value.trim();if(q)renderSuggestions(searchLandmarks(q));else sugBox.classList.remove('open');});
searchInput.addEventListener('blur', function(){setTimeout(function(){sugBox.classList.remove('open');},150);});
searchInput.addEventListener('keydown', function(e) {
  var items = sugBox.querySelectorAll('.suggestion');
  if (e.key==='ArrowDown'){e.preventDefault();selIdx=Math.min(selIdx+1,items.length-1);items.forEach(function(el,i){el.classList.toggle('selected',i===selIdx);});}
  else if (e.key==='ArrowUp'){e.preventDefault();selIdx=Math.max(selIdx-1,0);items.forEach(function(el,i){el.classList.toggle('selected',i===selIdx);});}
  else if (e.key==='Enter'){e.preventDefault();if(selIdx>=0&&items[selIdx]){items[selIdx].dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,cancelable:true}));}else{var res=searchLandmarks(searchInput.value);if(res.length>0){searchInput.value=res[0].name;sugBox.classList.remove('open');selectLandmark(res[0]);}}}
  else if (e.key==='Escape'){sugBox.classList.remove('open');}
});

document.getElementById('dl-btn').addEventListener('click', function() {
  if (!currentGroup) return;
  new THREE.GLTFExporter().parse(currentGroup, function(gltf){
    var blob=new Blob([gltf],{type:'application/octet-stream'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');a.href=url;a.download=currentLandmark.id+'.glb';a.click();
    URL.revokeObjectURL(url);
  }, function(err){console.error(err);}, {binary:true});
});

(function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);})();

new ResizeObserver(function(){
  var w=wrap.clientWidth,h=wrap.clientHeight;
  renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();
}).observe(wrap);

// Boot complete: hide loader, enable search input
window.__viewerReady = true;
var loaderEl = document.getElementById('loader');
if (loaderEl) loaderEl.style.display = 'none';
var searchBarEl = document.getElementById('search-bar');
if (searchBarEl) searchBarEl.classList.remove('loading');
searchInput.disabled = false;
searchInput.placeholder = 'Search any landmark — try "Big Ben" or "Pyramid"…';
searchInput.focus();

} // end initViewer()
</script>
</body>
</html>
