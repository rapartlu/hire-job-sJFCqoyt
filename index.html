<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Landmark Viewer</title>
  <!-- Three.js + addons are bundled and served from THIS origin (/three-bundle.js),
       not a third-party CDN. v4-v6 imported from esm.sh / jsDelivr and the module
       never loaded on the customer's network (CDN blocked, proxied, or timing out),
       surfacing as the misleading "3D engine did not load" error. Same-origin removes
       every third-party request, so if the page loads, the engine loads. -->
  <script type="importmap">
  {
    "imports": {
      "three": "/three-bundle.js",
      "three/addons/controls/OrbitControls.js": "/three-bundle.js",
      "three/addons/exporters/GLTFExporter.js": "/three-bundle.js"
    }
  }
  </script>
  <link rel="modulepreload" href="/three-bundle.js">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%8F%9B%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0b0c10;
      --surface: #12131a;
      --surface2: #1a1b25;
      --accent: #5b8cff;
      --accent2: #8fb4ff;
      --text: #e8eaf0;
      --muted: #7a7d92;
      --border: #252733;
      --footer-bg: #0d0e14;
    }
    html, body {
      width: 100%; height: 100%; background: var(--bg);
      color: var(--text); overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #app { display: flex; flex-direction: column; height: 100vh; }

    /* Header */
    #header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      height: 48px;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    #header h1 { font-size: 15px; font-weight: 600; }
    #header h1 span { color: var(--accent); }
    #dl-btn {
      background: var(--accent); color: #fff; border: none;
      border-radius: 5px; padding: 6px 14px; font-size: 13px;
      font-weight: 500; cursor: pointer; opacity: 1;
      transition: opacity 0.15s;
    }
    #dl-btn:hover { opacity: 0.85; }
    #dl-btn:disabled { opacity: 0.35; cursor: default; }

    /* Search bar */
    #search-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      flex-shrink: 0;
      position: relative;
    }
    #search-wrap { position: relative; max-width: 480px; margin: 0 auto; }
    #search-input {
      width: 100%; background: var(--surface2); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 9px 42px 9px 14px; font-size: 14px;
      outline: none; transition: border-color 0.15s;
    }
    #search-input:focus { border-color: var(--accent); }
    #search-input::placeholder { color: var(--muted); }
    #search-input:disabled { opacity: 0.7; cursor: wait; }
    /* While the engine loads, swap the magnifier for a small spinner so the
       search bar itself shows it is not ready yet (the canvas loader is hidden
       behind the search bar on mobile). */
    #search-bar.loading #search-icon {
      width: 15px; height: 15px; border-radius: 50%;
      border: 2px solid var(--border); border-top-color: var(--accent);
      animation: spin-centered 0.8s linear infinite; font-size: 0;
    }
    @keyframes spin-centered { to { transform: translateY(-50%) rotate(360deg); } }
    #search-icon {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      color: var(--muted); font-size: 16px; pointer-events: none;
    }
    #suggestions {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; z-index: 100; overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      display: none;
    }
    #suggestions.open { display: block; }
    .suggestion {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 14px; cursor: pointer;
      transition: background 0.1s;
    }
    .suggestion:hover, .suggestion.selected { background: rgba(91,140,255,0.12); }
    .sug-icon { font-size: 20px; min-width: 24px; text-align: center; }
    .sug-name { font-size: 13px; font-weight: 500; }
    .sug-city { font-size: 11px; color: var(--muted); }
    #no-results {
      padding: 14px; text-align: center;
      font-size: 13px; color: var(--muted);
      display: none;
    }

    /* Canvas area */
    #canvas-wrap {
      flex: 1; position: relative; overflow: hidden; min-height: 0;
      touch-action: none;
    }
    #canvas-wrap canvas { display: block; width: 100% !important; height: 100% !important; touch-action: none; }

    /* Loader */
    #loader {
      position: absolute; inset: 0; z-index: 50;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; background: var(--bg); padding: 24px; text-align: center;
    }
    #loader .spinner {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid var(--border); border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loader-text { font-size: 13px; color: var(--muted); max-width: 320px; line-height: 1.5; }
    #loader.error .spinner { display: none; }
    #loader.error #loader-text { color: var(--accent2); }

    /* Empty state */
    #empty-state {
      position: absolute; inset: 0; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; pointer-events: none;
    }
    #empty-state .icon { font-size: 52px; opacity: 0.25; }
    #empty-state p { font-size: 14px; color: var(--muted); }

    /* Info overlay */
    #info-overlay {
      position: absolute; bottom: 14px; left: 14px;
      background: rgba(10,11,18,0.82); backdrop-filter: blur(6px);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 9px 14px; pointer-events: none;
      display: none;
    }
    #info-overlay.visible { display: block; }
    #info-name { font-size: 15px; font-weight: 600; }
    #info-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
    #hint {
      position: absolute; top: 10px; right: 12px;
      font-size: 11px; color: rgba(255,255,255,0.3);
      pointer-events: none; text-align: right; line-height: 1.6;
      display: none;
    }
    #hint.visible { display: block; }

    /* Style selector */
    #style-bar {
      position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
      display: none; gap: 6px; padding: 6px;
      background: rgba(13,14,20,0.72); backdrop-filter: blur(8px);
      border: 1px solid var(--border); border-radius: 12px;
      max-width: calc(100% - 24px); overflow-x: auto; scrollbar-width: none;
      z-index: 5;
    }
    #style-bar::-webkit-scrollbar { display: none; }
    #style-bar.visible { display: flex; }
    .style-chip {
      flex: 0 0 auto; display: flex; flex-direction: column; align-items: center;
      gap: 2px; min-width: 58px; padding: 7px 8px; cursor: pointer;
      border: 1px solid transparent; border-radius: 9px;
      background: rgba(255,255,255,0.03); color: var(--muted);
      font-size: 11px; line-height: 1.2; transition: all 0.14s ease;
      user-select: none;
    }
    .style-chip:hover { background: rgba(255,255,255,0.08); color: #fff; }
    .style-chip .chip-icon { font-size: 18px; }
    .style-chip.active {
      background: rgba(124,160,255,0.16); border-color: var(--accent);
      color: #fff;
    }

    /* Footer */
    #footer {
      height: 34px; background: var(--footer-bg);
      border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      gap: 10px; font-size: 11px; color: var(--muted); flex-shrink: 0;
    }
    #footer a { color: var(--accent); text-decoration: none; }
    #footer a:hover { text-decoration: underline; }

    @media (max-width: 500px) {
      #search-input { font-size: 16px; }
    }
  </style>
</head>
<body>
<div id="app">
  <header id="header">
    <h1>3D <span>Landmark</span> Viewer</h1>
    <button id="dl-btn" disabled>&#8595; Download .glb</button>
  </header>

  <div id="search-bar" class="loading">
    <div id="search-wrap">
      <input id="search-input" type="text" placeholder="Starting 3D engine&hellip;" autocomplete="off" spellcheck="false" disabled>
      <span id="search-icon">&#x1F50D;</span>
      <div id="suggestions">
        <div id="no-results">No landmarks found. More coming soon.</div>
      </div>
    </div>
  </div>

  <main id="canvas-wrap">
    <div id="loader"><div class="spinner"></div><p id="loader-text">Loading 3D engine&hellip;</p></div>
    <div id="empty-state">
      <div class="icon">🏛️</div>

    </div>
    <div id="info-overlay"><div id="info-name"></div><div id="info-meta"></div></div>

  </main>

  <footer id="footer">
    <span>Built by Fleet &middot; Alpha access</span>
    <span>&middot;</span>
    <a href="https://hire.autonomous-fleet.workers.dev" target="_blank" rel="noopener">hire.autonomous-fleet.workers.dev</a>
    <span>&middot;</span>
    <span>v10 &middot; stylise</span>
  </footer>
</div>

<script>
// Watchdog. The module sets __viewerReady once it boots successfully. If it
// hasn't booted by the timeout, show a visible message rather than a silent
// blank canvas.
//
// v4-v6 lesson: the old message blamed the browser / CDN ("open in an up-to-date
// Chrome"). That was wrong and misleading - the real failure was almost always a
// runtime exception in module init, or the third-party CDN being blocked, NOT an
// old browser. The customer was on up-to-date Chrome and still saw it 3 times.
// v7 serves Three.js from this same origin (no CDN) AND captures the actual
// thrown error so the message tells the truth instead of guessing.
window.__viewerReady = false;
window.__viewerError = null;
function recordErr(msg) { if (msg && !window.__viewerError) window.__viewerError = String(msg); }
window.addEventListener('error', function (e) {
  // Module-evaluation throw, or a failed script/module fetch.
  if (e && e.error && e.error.message) recordErr(e.error.message);
  else if (e && e.message) recordErr(e.message);
});
window.addEventListener('unhandledrejection', function (e) {
  if (e && e.reason) recordErr(e.reason.message || e.reason);
});
setTimeout(function () {
  if (window.__viewerReady) return;
  var loader = document.getElementById('loader');
  var text = document.getElementById('loader-text');
  if (loader) loader.classList.add('error');
  var detail = window.__viewerError
    ? 'The 3D viewer hit an error while starting:<br><code style="font-size:12px;opacity:0.8">' +
        window.__viewerError.replace(/[<>&]/g, '') + '</code>'
    : 'The 3D viewer is taking longer than expected to start. This is usually a slow connection or a content blocker.';
  if (text) text.innerHTML = detail +
    '<br><br><a href="" onclick="location.reload();return false;" style="color:var(--accent)">Reload</a>';
  // The search box stays disabled until the engine boots; if it never does,
  // stop spinning and tell the user in the place they are looking.
  var bar = document.getElementById('search-bar');
  if (bar) bar.classList.remove('loading');
  var si = document.getElementById('search-input');
  if (si) si.placeholder = '3D viewer failed to start — reload the page';
}, 8000);
</script>
<script type="module">
// importmap in the <head> resolves all three specifiers to /three-bundle.js,
// a same-origin file served by this Worker. No third-party CDN, no runtime
// build step, no cross-origin requests - the failure mode that dogged v4-v6.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

// ─── Material helpers ─────────────────────────────────────────────────────────

function mat(color, roughness = 0.8, metalness = 0.05) {
  return new THREE.MeshStandardMaterial({ color, roughness, metalness });
}

// ─── Landmark builders ────────────────────────────────────────────────────────

function buildEiffelTower() {
  const g = new THREE.Group();
  const ironDark = mat(0x3b2f1e, 0.75, 0.35);
  const ironMid  = mat(0x5c4a35, 0.70, 0.30);
  const legData  = [{dx:1.6,dz:1.6},{dx:-1.6,dz:1.6},{dx:1.6,dz:-1.6},{dx:-1.6,dz:-1.6}];

  legData.forEach(({dx,dz}) => {
    const pts = [new THREE.Vector3(dx,0,dz), new THREE.Vector3(dx*0.35,4.5,dz*0.35)];
    const curve = new THREE.CatmullRomCurve3(pts);
    g.add(new THREE.Mesh(new THREE.TubeGeometry(curve,6,0.14,6,false), ironDark));
    for (let j=0;j<3;j++){
      const b = new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.6,4), ironMid);
      const p0=curve.getPoint(j/3), p1=curve.getPoint(j/3+0.15);
      b.position.lerpVectors(p0,p1,0.5); b.lookAt(p1); b.rotateX(Math.PI/2);
      g.add(b);
    }
  });
  const plat1 = new THREE.Mesh(new THREE.BoxGeometry(3.0,0.28,3.0), ironDark);
  plat1.position.y=4.5; g.add(plat1);
  for(let i=0;i<16;i++){const a=(i/16)*Math.PI*2;const p=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.35,0.06),ironMid);p.position.set(Math.cos(a)*1.4,4.8,Math.sin(a)*1.4);g.add(p);}
  legData.forEach(({dx,dz})=>{
    const pts=[new THREE.Vector3(dx*0.22,4.5,dz*0.22),new THREE.Vector3(dx*0.06,8.0,dz*0.06)];
    const curve=new THREE.CatmullRomCurve3(pts);
    g.add(new THREE.Mesh(new THREE.TubeGeometry(curve,4,0.09,5,false),ironDark));
  });
  const plat2=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.22,1.5),ironDark); plat2.position.y=8; g.add(plat2);
  const upper=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.65,4,10),ironDark); upper.position.y=10; g.add(upper);
  const plat3=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,0.2,12),ironMid); plat3.position.y=12; g.add(plat3);
  const spire=new THREE.Mesh(new THREE.ConeGeometry(0.22,3.5,8),ironDark); spire.position.y=13.75; g.add(spire);
  const tip=new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,1.2,5),ironMid); tip.position.y=15.6; g.add(tip);
  return g;
}

function buildColosseum() {
  const g = new THREE.Group();
  const stone = mat(0xc8a76a, 0.92);
  const dark  = mat(0x9e8350, 0.95);
  const arch  = mat(0x4a3d28, 0.98);
  const a=6.5, b=5.2, FLOORS=3, FH=1.6, BAYS=32;

  function ep(angle){return new THREE.Vector2(Math.cos(angle)*a,Math.sin(angle)*b);}

  for(let floor=0;floor<FLOORS;floor++){
    const y=floor*FH; const s=1-floor*0.02;
    const ws=new THREE.Shape();
    for(let i=0;i<=BAYS;i++){const ang=(i/BAYS)*Math.PI*2;const p=ep(ang);if(i===0)ws.moveTo(p.x*s,p.y*s);else ws.lineTo(p.x*s,p.y*s);}
    const hole=new THREE.Path();
    for(let i=0;i<=BAYS;i++){const ang=(i/BAYS)*Math.PI*2;if(i===0)hole.moveTo(Math.cos(ang)*(a-1)*s,Math.sin(ang)*(b-0.8)*s);else hole.lineTo(Math.cos(ang)*(a-1)*s,Math.sin(ang)*(b-0.8)*s);}
    ws.holes.push(hole);
    const wg=new THREE.ExtrudeGeometry(ws,{depth:FH*0.55,bevelEnabled:false}); wg.rotateX(Math.PI/2);
    const wm=new THREE.Mesh(wg,stone); wm.position.y=y; g.add(wm);
    for(let i=0;i<BAYS;i++){
      const ang=(i/BAYS)*Math.PI*2;const p=ep(ang);
      const pillar=new THREE.Mesh(new THREE.BoxGeometry(0.22,FH,0.22),dark);
      pillar.position.set(p.x*s*0.975,y+FH/2,p.y*s*0.975); g.add(pillar);
      if(floor<FLOORS-1){const ma=(i+0.5)/BAYS*Math.PI*2;const mx=Math.cos(ma)*a*s;const mz=Math.sin(ma)*b*s;const av=new THREE.Mesh(new THREE.BoxGeometry(0.18,FH*0.58,0.12),arch);av.position.set(mx*0.965,y+FH*0.34,mz*0.965);av.lookAt(av.position.x*2,av.position.y,av.position.z*2);g.add(av);}
    }
  }
  const aw=FLOORS*FH;
  const as2=new THREE.Shape();
  for(let i=0;i<=BAYS;i++){const ang=(i/BAYS)*Math.PI*2;if(i===0)as2.moveTo(Math.cos(ang)*a*0.96,Math.sin(ang)*b*0.96);else as2.lineTo(Math.cos(ang)*a*0.96,Math.sin(ang)*b*0.96);}
  const ah=new THREE.Path();
  for(let i=0;i<=BAYS;i++){const ang=(i/BAYS)*Math.PI*2;if(i===0)ah.moveTo(Math.cos(ang)*(a-1)*0.96,Math.sin(ang)*(b-0.8)*0.96);else ah.lineTo(Math.cos(ang)*(a-1)*0.96,Math.sin(ang)*(b-0.8)*0.96);}
  as2.holes.push(ah);
  const ag=new THREE.ExtrudeGeometry(as2,{depth:0.9,bevelEnabled:false}); ag.rotateX(Math.PI/2);
  g.add(new THREE.Mesh(ag,dark));
  return g;
}

function buildBigBen() {
  const g = new THREE.Group();
  const lime=mat(0xc8c0a0,0.9), roof=mat(0x4a6040,0.8), clock=mat(0xf0edd8,0.6), gold=mat(0xb8922a,0.4,0.6), dk=mat(0x3a3530,0.95);
  g.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(3.2,0.6,3.2),lime),{position:{x:0,y:0.3,z:0}}));
  const tower=new THREE.Mesh(new THREE.BoxGeometry(2.6,9,2.6),lime); tower.position.y=5.1; g.add(tower);
  const belfry=new THREE.Mesh(new THREE.BoxGeometry(2.8,1.2,2.8),lime); belfry.position.y=10.2; g.add(belfry);
  const cs=new THREE.Mesh(new THREE.BoxGeometry(2.8,1.8,2.8),clock); cs.position.y=11.7; g.add(cs);
  [{pos:[0,11.7,1.42],ry:0},{pos:[0,11.7,-1.42],ry:Math.PI},{pos:[1.42,11.7,0],ry:Math.PI/2},{pos:[-1.42,11.7,0],ry:-Math.PI/2}].forEach(({pos,ry})=>{
    const ring=new THREE.Mesh(new THREE.RingGeometry(0.55,0.65,32),gold); ring.position.set(...pos); ring.rotation.y=ry; ring.rotation.x=Math.PI/2; g.add(ring);
    const face=new THREE.Mesh(new THREE.CircleGeometry(0.55,32),clock); face.position.set(...pos); face.rotation.y=ry; face.rotation.x=Math.PI/2; g.add(face);
  });
  const corb=new THREE.Mesh(new THREE.BoxGeometry(3,0.3,3),gold); corb.position.y=12.75; g.add(corb);
  const sb=new THREE.Mesh(new THREE.CylinderGeometry(1.6,1.4,0.8,8),roof); sb.position.y=13.3; g.add(sb);
  const sp=new THREE.Mesh(new THREE.CylinderGeometry(0.05,1,5.5,8),roof); sp.position.y=16.45; g.add(sp);
  return g;
}

function buildTajMahal() {
  const g = new THREE.Group();
  const mb=mat(0xf5f0e8,0.3,0.05), ms=mat(0xddd5c0,0.4,0.05), inl=mat(0xb8d4c8,0.5,0.1), ar=mat(0x1a1814,0.95);
  g.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(11,0.7,11),ms),{position:{x:0,y:0.35,z:0}}));
  g.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(10,0.5,10),mb),{position:{x:0,y:0.95,z:0}}));
  [[-4.2,0,-4.2],[4.2,0,-4.2],[-4.2,0,4.2],[4.2,0,4.2]].forEach(([mx,,mz])=>{
    g.add(Object.assign(new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.45,0.4,12),ms),{position:{x:mx,y:1.4,z:mz}}));
    g.add(Object.assign(new THREE.Mesh(new THREE.CylinderGeometry(0.30,0.38,5.5,12),mb),{position:{x:mx,y:4.45,z:mz}}));
    [2.5,4,5.5].forEach(bh=>{g.add(Object.assign(new THREE.Mesh(new THREE.CylinderGeometry(0.45,0.45,0.18,12),ms),{position:{x:mx,y:1.6+bh,z:mz}}));});
    g.add(Object.assign(new THREE.Mesh(new THREE.SphereGeometry(0.35,10,7,0,Math.PI*2,0,Math.PI/2),mb),{position:{x:mx,y:7.5,z:mz}}));
    g.add(Object.assign(new THREE.Mesh(new THREE.ConeGeometry(0.08,1,6),ms),{position:{x:mx,y:8.3,z:mz}}));
  });
  g.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(5.5,3.5,5.5),mb),{position:{x:0,y:2.95,z:0}}));
  [[0,2.8,2.76,0],[0,2.8,-2.76,Math.PI],[2.76,2.8,0,Math.PI/2],[-2.76,2.8,0,-Math.PI/2]].forEach(([px,py,pz,ry])=>{
    const am=new THREE.Mesh(new THREE.BoxGeometry(1.6,2.5,0.1),ar); am.position.set(px,py,pz); am.rotation.y=ry; g.add(am);
  });
  [[-2,4.7,-2],[2,4.7,-2],[-2,4.7,2],[2,4.7,2]].forEach(([tx,ty,tz])=>{
    g.add(Object.assign(new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.6,1,8),mb),{position:{x:tx,y:ty,z:tz}}));
    g.add(Object.assign(new THREE.Mesh(new THREE.SphereGeometry(0.55,8,6,0,Math.PI*2,0,Math.PI/2),mb),{position:{x:tx,y:ty+0.55,z:tz}}));
    g.add(Object.assign(new THREE.Mesh(new THREE.ConeGeometry(0.1,0.8,6),ms),{position:{x:tx,y:ty+1.1,z:tz}}));

function buildStonehenge() {
  const g = new THREE.Group();
  const st=mat(0x9a9088,0.95), dark=mat(0x6a6060,0.98);
  // Outer sarsen circle (30 uprights + lintels)
  const R=5.5;
  for(let i=0;i<16;i++){
    const a=(i/16)*Math.PI*2;
    const stone=new THREE.Mesh(new THREE.BoxGeometry(0.7,2.8,0.5),st);
    stone.position.set(Math.cos(a)*R,1.4,Math.sin(a)*R);
    stone.rotation.y=-a; g.add(stone);
    // Lintel
    if(i%2===0){
      const ma=(i+0.5)/16*Math.PI*2;
      const lintel=new THREE.Mesh(new THREE.BoxGeometry(2.0,0.5,0.5),dark);
      lintel.position.set(Math.cos(ma)*R,2.9,Math.sin(ma)*R);
      lintel.rotation.y=-ma; g.add(lintel);
    }
  }
  // Inner trilithon horseshoe (5 pairs)
  const Ri=3.2;
  for(let i=0;i<5;i++){
    const a=(i/5)*Math.PI+Math.PI*0.5;
    const tall=new THREE.Mesh(new THREE.BoxGeometry(0.6,4,0.4),dark);
    tall.position.set(Math.cos(a)*Ri,2,Math.sin(a)*Ri); tall.rotation.y=-a; g.add(tall);
    const tall2=new THREE.Mesh(new THREE.BoxGeometry(0.6,4,0.4),dark);
    tall2.position.set(Math.cos(a+0.25)*Ri,2,Math.sin(a+0.25)*Ri); tall2.rotation.y=-a-0.25; g.add(tall2);
    const cap=new THREE.Mesh(new THREE.BoxGeometry(1.4,0.5,0.4),dark);
    cap.position.set(Math.cos(a+0.125)*Ri,4.25,Math.sin(a+0.125)*Ri); cap.rotation.y=-a-0.125; g.add(cap);
  }
  // Altar stone
  g.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(1,0.25,0.4),st),{position:{x:0,y:0.125,z:0}}));
  return g;
}

function buildSydneyOperaHouse() {
  const g = new THREE.Group();
  const tile=mat(0xf8f6f2,0.2,0.05), base=mat(0xe0dcd5,0.7), conc=mat(0xc8c4bc,0.8);
  // Podium base
  g.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(12,0.8,6),base),{position:{x:0,y:0.4,z:0}}));
  g.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(11,0.4,5.5),conc),{position:{x:0,y:1,z:0}}));

  // Shell geometry — iconic curved sail shapes
  // Shell 1: large main concert hall shell (3 nested shells)
  function buildShell(cx, cz, xScale, yScale, zScale, rotY) {
    const shellGroup = new THREE.Group();
    for (let s = 0; s < 3; s++) {
      const pts = [];
      for (let i = 0; i <= 16; i++) {
        const t = i / 16;
        const r = (1 - t) * 2.2;
        const h = Math.sin(t * Math.PI) * 3.5 * (1 - t * 0.3);
        pts.push(new THREE.Vector2(r * (1 + s * 0.12), h * yScale));
      }
      const geo = new THREE.LatheGeometry(pts, 8, 0, Math.PI);
      const shell = new THREE.Mesh(geo, tile);
      shell.scale.set(xScale * (1 - s * 0.08), 1, zScale * (1 - s * 0.08));
      shellGroup.add(shell);
    }
    shellGroup.position.set(cx, 1.2, cz);
    shellGroup.rotation.y = rotY;
    return shellGroup;
  }

  g.add(buildShell(-1.5, 0, 1.1, 1.0, 0.8, 0));      // main hall
  g.add(buildShell(2.5, 0, 0.85, 0.82, 0.65, 0.1));   // opera theatre
  g.add(buildShell(5.5, 0, 0.5, 0.55, 0.45, 0.2));    // smaller shell

  return g;
}

function buildParthenon() {
  const g = new THREE.Group();
  const marble=mat(0xf0e8d8,0.5,0.05), cols=mat(0xf8f0e0,0.4,0.05), dark=mat(0xd4c8a8,0.7);
  // Stepped base (stylobate)
  [[10.5,0.4,22],[10,0.4,21.5],[9.5,0.4,21]].forEach(([w,h,d],i)=>{g.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),marble),{position:{x:0,y:i*h+h/2,z:0}}));});
  // 46 columns (8 front/back, 17 long sides - simplified as ~30)
  const colH=5.5, colR=0.3;
  const frontCols=8, sideCols=17;
  const STYLE=[];
  for(let i=0;i<frontCols;i++) STYLE.push([(i/(frontCols-1)-0.5)*8.5, 10]);
  for(let i=0;i<frontCols;i++) STYLE.push([(i/(frontCols-1)-0.5)*8.5, -10]);
  for(let j=1;j<sideCols-1;j++) STYLE.push([4.5, (j/(sideCols-1)-0.5)*19]);
  for(let j=1;j<sideCols-1;j++) STYLE.push([-4.5, (j/(sideCols-1)-0.5)*19]);
  STYLE.forEach(([cx,cz])=>{const col=new THREE.Mesh(new THREE.CylinderGeometry(colR*0.8,colR,colH,10),cols);col.position.set(cx,1.2+colH/2,cz);g.add(col);});
  // Architrave
  g.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(9.8,0.7,22),dark),{position:{x:0,y:1.2+colH+0.35,z:0}}));
  // Frieze
  g.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(9.6,0.8,21.8),marble),{position:{x:0,y:1.2+colH+1.1,z:0}}));
  // Gable (pediment) front and back
  [[0,0,10],[-Math.PI,0,-10]].forEach(([rx,ry,pz])=>{
    const pts=[new THREE.Vector2(-4.8,0),new THREE.Vector2(0,1.8),new THREE.Vector2(4.8,0)];
    const shape=new THREE.Shape(pts); shape.lineTo(-4.8,0);
    const geo=new THREE.ExtrudeGeometry(shape,{depth:0.3,bevelEnabled:false});
    const mesh=new THREE.Mesh(geo,marble); mesh.position.set(0,1.2+colH+2,pz); mesh.rotation.y=ry; g.add(mesh);
  });
  // Cella (inner chamber)
  const cella=new THREE.Mesh(new THREE.BoxGeometry(7,5,18),marble); cella.position.y=1.2+2.75; g.add(cella);
  return g;
}

  },
];

// ─── Search helpers ───────────────────────────────────────────────────────────

function searchLandmarks(query) {
  const q = query.toLowerCase().trim();
  if (!q) return LANDMARKS.slice(0, 6); // show first 6 as defaults
  return LANDMARKS.filter(lm =>
    lm.aliases.some(a => a.includes(q)) || lm.name.toLowerCase().includes(q) || lm.city.toLowerCase().includes(q)
  );
}

// ─── Scene setup ─────────────────────────────────────────────────────────────

const wrap = document.getElementById('canvas-wrap');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(wrap.clientWidth || 800, wrap.clientHeight || 600);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
wrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0c10);
scene.fog = new THREE.Fog(0x0b0c10, 40, 90);

const camera = new THREE.PerspectiveCamera(45, (wrap.clientWidth||800)/(wrap.clientHeight||600), 0.1, 200);
camera.position.set(8, 8, 20);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 4;
controls.maxDistance = 80;
controls.maxPolarAngle = Math.PI / 2 + 0.1;

// Lights
scene.add(new THREE.AmbientLight(0x8090c0, 0.6));
const sun = new THREE.DirectionalLight(0xfff5e0, 2.2);
sun.position.set(12, 20, 10);
sun.castShadow = true;
sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 80;
sun.shadow.camera.left = -25; sun.shadow.camera.right = 25;
sun.shadow.camera.top = 25; sun.shadow.camera.bottom = -25;
sun.shadow.mapSize.set(2048, 2048);
scene.add(sun);
scene.add(Object.assign(new THREE.DirectionalLight(0x4060ff, 0.5), {position: new THREE.Vector3(-10,5,-8)}));

// Ground
const ground = new THREE.Mesh(new THREE.CircleGeometry(35,64), new THREE.MeshStandardMaterial({color:0x16181f,roughness:0.9,metalness:0.1}));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true;
scene.add(ground);
scene.add(Object.assign(new THREE.GridHelper(35,22,0x252733,0x1a1c28), {position: new THREE.Vector3(0,0.01,0)}));

// ─── Stylisation ──────────────────────────────────────────────────────────────
// The customer's product: pick a landmark, then render the same geometry in a
// chosen visual style. Each style re-materialises the current model; the chosen
// style persists across landmarks and is baked into the downloaded .glb.

// Procedural environment map (core THREE, no addon) so chrome/gold have something
// to reflect. A vertical gradient + two bright blobs = believable studio reflection.
const ENV_MAP = (() => {
  const c = document.createElement('canvas'); c.width = 512; c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0.00, '#aab8e0'); g.addColorStop(0.45, '#e6edff');
  g.addColorStop(0.50, '#ffffff'); g.addColorStop(0.56, '#3a3f4d');
  g.addColorStop(1.00, '#0b0c10');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 512, 256);
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.beginPath(); ctx.arc(140, 70, 38, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,214,150,0.7)';
  ctx.beginPath(); ctx.arc(380, 92, 26, 0, Math.PI * 2); ctx.fill();
  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  const pmrem = new THREE.PMREMGenerator(renderer);
  const env = pmrem.fromEquirectangular(tex).texture;
  pmrem.dispose(); tex.dispose();
  return env;
})();

// 4-step greyscale ramp for cel shading.
const TOON_GRADIENT = (() => {
  const steps = [55, 120, 190, 245];
  const data = new Uint8Array(steps.length * 4);
  steps.forEach((v, i) => { data[i*4] = v; data[i*4+1] = v; data[i*4+2] = v; data[i*4+3] = 255; });
  const tex = new THREE.DataTexture(data, steps.length, 1, THREE.RGBAFormat);
  tex.minFilter = THREE.NearestFilter; tex.magFilter = THREE.NearestFilter; tex.needsUpdate = true;
  return tex;
})();

function neonize(hex) {
  const c = new THREE.Color(hex); const hsl = {}; c.getHSL(hsl);
  return new THREE.Color().setHSL(hsl.h, 1.0, 0.62);
}

const STYLES = [
  { id:'realistic', label:'Realistic', icon:'🌅', bg:0x0b0c10, fog:[40,90], env:false,
    make:(base)=> new THREE.MeshStandardMaterial({ color:base, roughness:0.8, metalness:0.05 }) },
  { id:'lowpoly', label:'Low-poly', icon:'🔻', bg:0x12131a, fog:[40,90], env:false,
    make:(base)=> new THREE.MeshStandardMaterial({ color:base, roughness:0.95, metalness:0.0, flatShading:true }) },
  { id:'clay', label:'Clay', icon:'🟫', bg:0x1a1612, fog:[40,95], env:false,
    make:()=> new THREE.MeshStandardMaterial({ color:0xc97b5a, roughness:1.0, metalness:0.0 }) },
  { id:'chrome', label:'Chrome', icon:'🪞', bg:0x0d0f15, fog:null, env:true,
    make:()=> new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.08, metalness:1.0, envMapIntensity:1.4 }) },
  { id:'gold', label:'Gold', icon:'🥇', bg:0x14110a, fog:null, env:true,
    make:()=> new THREE.MeshStandardMaterial({ color:0xffd24a, roughness:0.28, metalness:1.0, envMapIntensity:1.3 }) },
  { id:'toon', label:'Toon', icon:'🎨', bg:0x101826, fog:[45,95], env:false,
    make:(base)=> new THREE.MeshToonMaterial({ color:base, gradientMap:TOON_GRADIENT }) },
  { id:'neon', label:'Neon', icon:'💡', bg:0x05060a, fog:null, env:false,
    make:(base)=> new THREE.MeshBasicMaterial({ color:neonize(base), wireframe:true }) },
  { id:'xray', label:'X-ray', icon:'👻', bg:0x04070d, fog:null, env:false,
    make:()=> new THREE.MeshStandardMaterial({ color:0x66ccff, emissive:0x16365f, roughness:0.4, metalness:0.0, transparent:true, opacity:0.34, depthWrite:false, side:THREE.DoubleSide }) },
  { id:'blueprint', label:'Blueprint', icon:'📐', bg:0x0a1a3a, fog:null, env:false,
    make:()=> new THREE.MeshBasicMaterial({ color:0x8fd3ff, wireframe:true }) },
];
const STYLE_BY_ID = Object.fromEntries(STYLES.map(s => [s.id, s]));
let currentStyle = 'realistic';

function applyStyle(group, styleId) {
  const st = STYLE_BY_ID[styleId] || STYLES[0];
  scene.environment = st.env ? ENV_MAP : null;
  scene.background = new THREE.Color(st.bg);
  scene.fog = st.fog ? new THREE.Fog(st.bg, st.fog[0], st.fog[1]) : null;
  group.traverse(o => {
    if (!o.isMesh) return;
    const base = (o.userData.baseColor != null) ? o.userData.baseColor : 0xcccccc;
    const old = o.material;
    o.material = st.make(base);
    if (old && old.dispose) old.dispose();
  });
}

// Build the style chip row once. Clicking a chip re-materialises the current
// model in that style (no rebuild) and remembers the choice for the next one.
(function buildStyleBar() {
  const bar = document.getElementById('style-bar');
  STYLES.forEach(st => {
    const chip = document.createElement('div');
    chip.className = 'style-chip' + (st.id === currentStyle ? ' active' : '');
    chip.dataset.style = st.id;
    chip.innerHTML = `<span class="chip-icon">${st.icon}</span><span>${st.label}</span>`;
    chip.addEventListener('click', () => {
      currentStyle = st.id;
      bar.querySelectorAll('.style-chip').forEach(c =>
        c.classList.toggle('active', c.dataset.style === st.id));
      if (currentGroup) applyStyle(currentGroup, currentStyle);
    });
    bar.appendChild(chip);
  });
})();

let currentGroup = null;
let currentLandmark = null;

function selectLandmark(lm) {
  if (currentGroup) scene.remove(currentGroup);
  currentLandmark = lm;
  currentGroup = lm.build();
  currentGroup.traverse(o => {
    if (o.isMesh) {
      o.castShadow = true; o.receiveShadow = true;
      // Remember the colour the builder chose so styles can keep or override it.
      if (o.material && o.material.color) o.userData.baseColor = o.material.color.getHex();
    }
  });
  applyStyle(currentGroup, currentStyle);
  scene.add(currentGroup);

  document.getElementById('info-name').textContent = lm.name;
  document.getElementById('info-meta').textContent = `${lm.city} · ${lm.year}`;
  document.getElementById('info-overlay').classList.add('visible');
  document.getElementById('hint').classList.add('visible');
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('dl-btn').disabled = false;
  document.getElementById('style-bar').classList.add('visible');

  // Camera move
  const target = new THREE.Vector3(lm.camera.x, lm.camera.y, lm.camera.z);
  controls.target.set(0, Math.max(lm.camera.y * 0.4, 4), 0);
  const from = camera.position.clone();
  let t = 0;
  const anim = () => { t += 0.04; if (t >= 1) { camera.position.copy(target); return; } camera.position.lerpVectors(from, target, t*t*(3-2*t)); requestAnimationFrame(anim); };
  anim();
}

// ─── Search UI ────────────────────────────────────────────────────────────────

const searchInput = document.getElementById('search-input');
const sugBox = document.getElementById('suggestions');
const noResults = document.getElementById('no-results');
let selIdx = -1;

function renderSuggestions(results) {
  // Clear existing suggestion items
  sugBox.querySelectorAll('.suggestion').forEach(el => el.remove());
  selIdx = -1;

  if (results.length === 0) {
    noResults.style.display = 'block';
    sugBox.classList.add('open');
    return;
  }
  noResults.style.display = 'none';

  results.forEach((lm, i) => {
    const div = document.createElement('div');
    div.className = 'suggestion';
    div.innerHTML = `<span class="sug-icon">${lm.icon}</span><div><div class="sug-name">${lm.name}</div><div class="sug-city">${lm.city}</div></div>`;
    div.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      searchInput.value = lm.name;
      sugBox.classList.remove('open');
      selectLandmark(lm);
    });
    sugBox.appendChild(div);
  });
  sugBox.classList.add('open');
}

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim();
  if (!q) { sugBox.classList.remove('open'); return; }
  renderSuggestions(searchLandmarks(q));
});

searchInput.addEventListener('focus', () => {
  const q = searchInput.value.trim();
  if (q) renderSuggestions(searchLandmarks(q));
  else { sugBox.classList.remove('open'); }
});

searchInput.addEventListener('blur', () => {
  setTimeout(() => sugBox.classList.remove('open'), 150);
});

searchInput.addEventListener('keydown', (e) => {
  const items = sugBox.querySelectorAll('.suggestion');
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    selIdx = Math.min(selIdx+1, items.length-1);
    items.forEach((el,i) => el.classList.toggle('selected', i===selIdx));
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    selIdx = Math.max(selIdx-1, 0);
    items.forEach((el,i) => el.classList.toggle('selected', i===selIdx));
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (selIdx >= 0 && items[selIdx]) {
      items[selIdx].dispatchEvent(new PointerEvent('pointerdown', {bubbles: true, cancelable: true}));
    } else {
      const results = searchLandmarks(searchInput.value);
      if (results.length > 0) { searchInput.value = results[0].name; sugBox.classList.remove('open'); selectLandmark(results[0]); }
    }
  } else if (e.key === 'Escape') {
    sugBox.classList.remove('open');
  }
});

// ─── Download ─────────────────────────────────────────────────────────────────

document.getElementById('dl-btn').addEventListener('click', () => {
  if (!currentGroup) return;
  new GLTFExporter().parse(currentGroup, (gltf) => {
    const blob = new Blob([gltf], {type:'application/octet-stream'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download=`${currentLandmark.id}.glb`; a.click();
    URL.revokeObjectURL(url);
  }, (err)=>console.error(err), {binary:true});
});

// ─── Render loop & resize ─────────────────────────────────────────────────────

(function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); })();

new ResizeObserver(() => {
  const w=wrap.clientWidth, h=wrap.clientHeight;
  renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix();
}).observe(wrap);

// Engine booted: clear the loader and unblock the watchdog.
window.__viewerReady = true;
const loaderEl = document.getElementById('loader');
if (loaderEl) loaderEl.style.display = 'none';

// The search box is disabled in the static HTML until this module finishes
// loading three.js from the CDN. Its event listeners live in this module, so
// before this point typing and clicking a result do nothing - that was the
// "I click and nothing happens / is it loading?" bug. Enable it now that the
// handlers are attached, restore the real placeholder, and focus it.
const searchBarEl = document.getElementById('search-bar');
if (searchBarEl) searchBarEl.classList.remove('loading');
if (searchInput) {
  searchInput.disabled = false;
  searchInput.placeholder = 'Search any landmark — try "Big Ben" or "Pyramid"…';
  searchInput.focus();
}
</script>
</body>
</html>
